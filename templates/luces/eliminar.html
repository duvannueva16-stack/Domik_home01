{% extends 'base.html' %}
{% block title %}Eliminar luz · Domik HOME{% endblock %}

{% block panel %}
<article class="tarjeta">
  <h2 class="pagina__titulo">¿Eliminar {{ luz.dispositivo.nombre }}?</h2>
  <p class="pagina__sub">Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_luces' %}">Cancelar</a>
  </form>
</article>
{% endblock %}
