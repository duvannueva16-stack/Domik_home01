{% extends 'base.html' %}
{% block title %}Eliminar cámara · Domik HOME{% endblock %}

{% block panel %}
<article class="tarjeta">
  <h2 class="pagina__titulo">¿Eliminar {{ camara.dispositivo.nombre }}?</h2>
  <p class="pagina__sub">Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_camara' %}">Cancelar</a>
  </form>
</article>
{% endblock %}
