{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Domik HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
  <main style="min-height:100vh; display:grid; place-items:center; padding:1rem;">
    <article class="tarjeta" style="width:100%; max-width:380px;">
      <h1 class="pagina__titulo">Domik <span>HOME</span></h1>
      <p class="pagina__sub">Tu hogar, en tus manos</p>

      {% if form.errors %}
      <p>Usuario o contraseña incorrectos.</p>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Ingresar</button>
      </form>
    </article>
  </main>
</body>
</html>
