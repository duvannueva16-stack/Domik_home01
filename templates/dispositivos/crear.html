{% extends 'base.html' %}
{% block title %}Nuevo dispositivo · Domik HOME{% endblock %}

{% block panel %}
<article class="tarjeta">
  <h2 class="pagina__titulo">Nuevo dispositivo</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'lista_dispositivos' %}">Cancelar</a>
  </form>
</article>
{% endblock %}
