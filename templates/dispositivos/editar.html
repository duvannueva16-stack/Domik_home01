{% extends 'base.html' %}
{% block title %}Editar dispositivo · Domik HOME{% endblock %}

{% block panel %}
<article class="tarjeta">
  <h2 class="pagina__titulo">Editar {{ dispositivo.nombre }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Actualizar</button>
    <a href="{% url 'lista_dispositivos' %}">Cancelar</a>
  </form>
</article>
{% endblock %}
